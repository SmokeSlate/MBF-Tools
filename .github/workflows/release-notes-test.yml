name: Release notes tests

on:
  push:
    paths:
      - docs/**
      - .github/workflows/release-notes-test.yml
  pull_request:
    paths:
      - docs/**
      - .github/workflows/release-notes-test.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test docs/tests/*.test.cjs
